# Global framework settings shared across all environments.
framework:
  name: TestCherryPick
  default_environment: qa
  output_dir: results
  log_level: INFO

reporting:
  formats:
    - xml
    - html
  screenshots_on_failure: true
  retain_days: 25

execution:
  parallel: true
  max_workers: 4
  default_timeout_seconds: 90
  retry_failed: 2
  fail_fast: false

integrations:
  jira:
    enabled: false
    project_key: TCP
  slack:
    enabled: true
    channel: "#release-65-5-alerts"
    notify_on:
      - failure
      - flaky

features:
  transactions_v2: true
  refunds:
    enabled: true
    max_amount: 10000
    auto_approve_below: 50

logging:
  level: INFO
  format: json
  destinations:
    - stdout
    - file
  file:
    path: results/automation.log
    rotate_mb: 20
    backups: 5
