# Global framework settings shared across all environments.
framework:
  name: TestCherryPick
  default_environment: qa
  output_dir: results
  log_level: INFO

reporting:
  formats:
    - xml
    - html
  screenshots_on_failure: true
  retain_days: 14

execution:
  parallel: false
  max_workers: 2
  default_timeout_seconds: 120
  retry_failed: 0

integrations:
  jira:
    enabled: false
    project_key: TCP
  slack:
    enabled: false
    channel: "#qa-automation"

features:
  transactions_v2: true
  refunds:
    enabled: true
    max_amount: 10000
    auto_approve_below: 50
